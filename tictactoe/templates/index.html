<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TicTacToe (Minimax + AlphaBeta)</title>
  <style>
    body { font-family: Arial; display:flex; justify-content:center; margin-top:40px; }
    .box { text-align:center; }
    .grid { display:grid; grid-template-columns:repeat(3, 90px); gap:8px; margin:20px auto; }
    button.cell {
      width:90px; height:90px; font-size:36px; cursor:pointer;
    }
    .status { font-size:18px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>TicTacToe</h2>
    <div class="status">{{ status }}</div>

    <div class="grid">
      {% for i in range(9) %}
        <form method="POST" action="/move">
          <input type="hidden" name="pos" value="{{ i }}">
          <button class="cell" type="submit"
            {% if board[i] != " " or w or draw %} disabled {% endif %}>
            {{ board[i] }}
          </button>
        </form>
      {% endfor %}
    </div>

    <form method="POST" action="/reset">
      <button type="submit">Reset</button>
    </form>
  </div>
</body>
</html>
